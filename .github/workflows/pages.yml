name: Deploy demo to GitHub Pages

# Publishes only the static demo: index.html, demo-data.json, catalog.json and
# (if present) the Powered by BGG logo. server.py, bgg_token.txt and any personal
# data are never uploaded.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - demo-data.json
      - catalog.json
      - powered-by-bgg.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Free GitHub plans can't serve Pages from a private repo, so skip (rather than
    # fail) until the repo is public. After flipping it public, run this
    # workflow once from the Actions tab (Run workflow) to publish the demo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html demo-data.json catalog.json _site/
          if [ -f powered-by-bgg.png ]; then cp powered-by-bgg.png _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
